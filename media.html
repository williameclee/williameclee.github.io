<!DOCTYPE html>
<html lang="en-UK">

	<head>
		<meta charset="UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Media | En-Chi Lee</title>
		<!-- Favicon -->
		<link rel="icon" type="image/png" sizes="32x32"
			href="/webpage_supplements/favicon.png">
		<!-- Custom styles -->
		<link rel="stylesheet" href="/webpage_supplements/style.css"
			media="All">
		<link rel="stylesheet"
			href="/posts/posts.css" media="All">
		<link rel="stylesheet"
			href="/media/media.css" media="All">
	</head>

	<body>
		<header>
			<nav id="navbar"></nav>
		</header>

		<!-- Main content -->
		<article class="container post-container">
			<h1>Media</h1>
			<h2>Photography</h2>
			<div id="albums-photography">
				<template id="photo-template">
					<div class="photo-item">
						<img class="photo-img" loading="lazy">
						<div class="photo-overlay">
							<div class="photo-desc"></div>
							<div class="photo-loc"></div>
							<div class="photo-date"></div>
						</div>
					</div>
				</template>
			</div>
		</article>

		<!-- Footer -->
		<footer id="footer"></footer>

		<!-- Custom script -->
		<script src="/webpage_supplements/universal-components.js"
			type="module"></script>
		<script src="/media/media.js" type="module"></script>
		<!-- Icons -->
		<script src="https://kit.fontawesome.com/513d0fe828.js"
			crossorigin="anonymous"></script>
	</body>

</html>
